name: Deploy

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: https://staging.lab-app.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Set image tag
        id: image
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to staging
        run: |
          kubectl set image deployment/lab-app \
            lab-app=ghcr.io/${{ github.repository }}/lab-app:${{ steps.image.outputs.tag }} \
            -n lab-app-staging
          kubectl rollout status deployment/lab-app -n lab-app-staging --timeout=300s

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ENDPOINT="https://staging.lab-app.example.com" ./scripts/smoke-test.sh

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://lab-app.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Set image tag
        id: image
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          kubectl set image deployment/lab-app \
            lab-app=ghcr.io/${{ github.repository }}/lab-app:${{ steps.image.outputs.tag }} \
            -n lab-app-prod
          kubectl rollout status deployment/lab-app -n lab-app-prod --timeout=300s

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ENDPOINT="https://lab-app.example.com" ./scripts/smoke-test.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed! Rolling back..."
          kubectl rollout undo deployment/lab-app -n lab-app-prod
